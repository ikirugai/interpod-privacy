<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { width: 1024px; height: 500px; overflow: hidden; }
        .container {
            width: 1024px;
            height: 500px;
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 40%, #0f3460 100%);
            display: flex;
            align-items: center;
            justify-content: center;
            flex-direction: column;
            position: relative;
            overflow: hidden;
        }
        .wave {
            position: absolute;
            bottom: 0;
            left: 0;
            width: 100%;
            height: 200px;
            opacity: 0.08;
        }
        .wave-line {
            position: absolute;
            width: 100%;
            height: 2px;
            background: white;
            border-radius: 2px;
        }
        .app-name {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            font-size: 96px;
            font-weight: 700;
            color: #ffffff;
            letter-spacing: -2px;
            z-index: 1;
        }
        .app-name span {
            color: #4fc3f7;
        }
        .tagline {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            font-size: 28px;
            font-weight: 300;
            color: rgba(255, 255, 255, 0.7);
            margin-top: 16px;
            letter-spacing: 2px;
            z-index: 1;
        }
        .waveform {
            display: flex;
            align-items: center;
            gap: 4px;
            margin-top: 40px;
            z-index: 1;
        }
        .bar {
            width: 4px;
            background: #4fc3f7;
            border-radius: 2px;
            opacity: 0.6;
        }
        .dots {
            position: absolute;
            width: 100%;
            height: 100%;
            z-index: 0;
        }
        .dot {
            position: absolute;
            border-radius: 50%;
            background: rgba(79, 195, 247, 0.1);
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="dots">
            <div class="dot" style="width:300px;height:300px;top:-50px;right:-80px;"></div>
            <div class="dot" style="width:200px;height:200px;bottom:-40px;left:-60px;"></div>
            <div class="dot" style="width:150px;height:150px;top:100px;left:200px;"></div>
        </div>
        <div class="app-name">Inter<span>Pod</span></div>
        <div class="tagline">PODCAST PLAYER WITH LIVE TRANSCRIPTION</div>
        <div class="waveform" id="waveform"></div>
    </div>
    <script>
        const wf = document.getElementById('waveform');
        const heights = [12,20,35,28,45,38,52,30,48,55,32,42,58,35,25,48,40,55,28,45,35,52,30,20,38,50,42,35,55,28,45,38,22,48,35,52,40,28,45,55,32,20,38,48,35,52,42,28,15];
        heights.forEach(h => {
            const bar = document.createElement('div');
            bar.className = 'bar';
            bar.style.height = h + 'px';
            wf.appendChild(bar);
        });
    </script>
</body>
</html>
